<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Finans Takip</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    body {
      -webkit-tap-highlight-color: transparent;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

  </style>

</head>


<body
  class="
    bg-slate-950
    text-slate-100
    min-h-screen
    pb-24
  "
>


  <div
    class="
      w-full
      max-w-md
      mx-auto
      p-4
    "
  >


    <!-- ==================================================
         BAŞLIK
    =================================================== -->

    <header
      class="
        flex
        justify-between
        items-center
        py-2
        border-b
        border-slate-800
      "
    >

      <div>

        <p
          class="
            text-xs
            text-emerald-400
            font-medium
          "
        >
          Finans Takip
        </p>

        <h1
          id="pageTitle"
          class="
            text-lg
            font-semibold
            text-slate-200
          "
        >
          Harcama Girişi
        </h1>

      </div>


      <span
        id="statusBadge"
        class="
          text-xs
          px-2.5
          py-1
          rounded-full
          bg-slate-800
          text-slate-400
        "
      >
        Hazır
      </span>

    </header>



    <!-- ==================================================
         HARCAMA GİRİŞİ
    =================================================== -->

    <main
      id="expenseView"
      class="
        mt-4
        space-y-4
      "
    >


      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-5
          text-center
        "
      >

        <label
          class="
            text-xs
            text-slate-400
            font-medium
            tracking-wider
            uppercase
            block
            mb-2
          "
        >
          Harcama Tutarı
        </label>


        <div
          class="
            flex
            items-center
            justify-center
            gap-2
          "
        >

          <span
            class="
              text-3xl
              font-bold
              text-emerald-400
            "
          >
            ₺
          </span>


          <input
            id="expenseAmount"
            type="number"
            step="0.01"
            min="0"
            placeholder="0.00"

            class="
              bg-transparent
              text-4xl
              font-bold
              w-48
              text-center
              text-white
              focus:outline-none
              placeholder-slate-600
            "
          >

        </div>

      </div>



      <input
        id="expenseDescription"
        type="text"
        maxlength="150"
        placeholder="Kısa açıklama (opsiyonel)..."

        class="
          w-full
          bg-slate-900
          border
          border-slate-800
          rounded-xl
          px-4
          py-3
          text-sm
          text-slate-200
          placeholder-slate-500
          focus:outline-none
          focus:border-emerald-500
        "
      >



      <div>

        <span
          class="
            text-xs
            text-slate-400
            font-medium
            block
            mb-2
          "
        >
          1. Kategori Seç
        </span>


        <div
          id="mainCategoriesGrid"
          class="
            grid
            grid-cols-2
            gap-2.5
          "
        ></div>

      </div>



      <div
        id="subCategorySection"
        class="hidden"
      >

        <div
          class="
            flex
            justify-between
            items-center
            mb-2
          "
        >

          <span
            class="
              text-xs
              text-slate-400
              font-medium
            "
          >
            2. Alt Kategori Seç
          </span>


          <button
            type="button"
            onclick="resetCategorySelection()"
            class="
              text-xs
              text-slate-500
              hover:text-slate-300
            "
          >
            Vazgeç
          </button>

        </div>


        <div
          id="subCategoriesGrid"
          class="
            grid
            grid-cols-2
            gap-2
          "
        ></div>

      </div>


    </main>



    <!-- ==================================================
         GELİR GİRİŞİ
    =================================================== -->

    <main
      id="incomeView"
      class="
        hidden
        mt-4
        space-y-4
      "
    >


      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-5
          text-center
        "
      >

        <label
          class="
            text-xs
            text-slate-400
            font-medium
            tracking-wider
            uppercase
            block
            mb-2
          "
        >
          Gelir Tutarı
        </label>


        <div
          class="
            flex
            items-center
            justify-center
            gap-2
          "
        >

          <span
            class="
              text-3xl
              font-bold
              text-emerald-400
            "
          >
            ₺
          </span>


          <input
            id="incomeAmount"
            type="number"
            step="0.01"
            min="0"
            placeholder="0.00"

            class="
              bg-transparent
              text-4xl
              font-bold
              w-48
              text-center
              text-white
              focus:outline-none
              placeholder-slate-600
            "
          >

        </div>

      </div>



      <input
        id="incomeDescription"
        type="text"
        maxlength="150"
        placeholder="Kısa açıklama (opsiyonel)..."

        class="
          w-full
          bg-slate-900
          border
          border-slate-800
          rounded-xl
          px-4
          py-3
          text-sm
          text-slate-200
          placeholder-slate-500
          focus:outline-none
          focus:border-emerald-500
        "
      >



      <div>

        <span
          class="
            text-xs
            text-slate-400
            font-medium
            block
            mb-2
          "
        >
          Gelir Türü Seç
        </span>


        <div
          id="incomeTypesGrid"
          class="
            grid
            grid-cols-2
            gap-2.5
          "
        ></div>

      </div>


    </main>


  </div>



  <!-- ==================================================
       ALT MENÜ
  =================================================== -->

  <nav
    class="
      fixed
      bottom-0
      left-0
      right-0
      bg-slate-900/95
      backdrop-blur-md
      border-t
      border-slate-800
      flex
      justify-around
      py-3
      z-50
    "
  >


    <button
      id="navExpenseBtn"
      type="button"
      onclick="switchTab('expense')"

      class="
        flex
        flex-col
        items-center
        gap-1
        text-emerald-400
      "
    >

      <span class="text-lg">➕</span>

      <span class="text-xs font-medium">
        Harcama
      </span>

    </button>



    <button
      id="navIncomeBtn"
      type="button"
      onclick="switchTab('income')"

      class="
        flex
        flex-col
        items-center
        gap-1
        text-slate-500
      "
    >

      <span class="text-lg">💰</span>

      <span class="text-xs font-medium">
        Gelir
      </span>

    </button>



    <button
      id="navSummaryBtn"
      type="button"
      onclick="showComingSoon()"

      class="
        flex
        flex-col
        items-center
        gap-1
        text-slate-500
      "
    >

      <span class="text-lg">📊</span>

      <span class="text-xs font-medium">
        Özet
      </span>

    </button>


  </nav>



  <script>


    // =====================================================
    // APPS SCRIPT
    // =====================================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbz14ItYilxfdHDyNowumHNGUeYYRddF53B-3YJ863icIcwbZDaK1h8BwrDPl8VNNdq3/exec";



    // =====================================================
    // HARCAMA KATEGORİLERİ
    // =====================================================

    const EXPENSE_CATEGORIES = {

      "Market": {
        icon: "🛒",
        subs: [
          "Ev İhtiyaçları",
          "Atıştırmalık"
        ]
      },

      "Yemek": {
        icon: "🍔",
        subs: [
          "Dışarıda Restoran/Kafe",
          "Yemek Siparişi"
        ]
      },

      "Ulaşım": {
        icon: "🚌",
        subs: [
          "Toplu Taşıma / Akbil",
          "Taksi",
          "Şehirlerarası Seyahat"
        ]
      },

      "Eğlence & Sosyal": {
        icon: "🎟️",
        subs: [
          "Sinema/Tiyatro",
          "Dışarıda Kahve",
          "Oyunlar",
          "Sosyal Aktivite"
        ]
      },

      "Üniversite": {
        icon: "🎓",
        subs: [
          "Yemekhane",
          "Kırtasiye / Baskı",
          "Kampüs Kahve/Market",
          "Harç / Kayıt",
          "Kulüp / Etkinlik"
        ]
      },

      "Sabit Abonelikler": {
        icon: "💳",
        subs: [
          "Akbil Abonman",
          "Spotify",
          "Dijital Abonelik"
        ]
      },

      "Kişisel Bakım & Sağlık": {
        icon: "✂️",
        subs: [
          "Kıyafet / Ayakkabı",
          "Kuaför / Berber",
          "Eczane / Sağlık"
        ]
      }

    };



    // =====================================================
    // GELİR TÜRLERİ
    // =====================================================

    const INCOME_TYPES = {

      "Aile Desteği": "👨‍👩‍👦",

      "Burs": "🎓",

      "İş / Freelance": "💻",

      "İade / Geri Ödeme": "💸",

      "Hediye": "🎁",

      "Diğer": "💰"

    };



    let selectedMainCategory = null;



    // =====================================================
    // SEKME DEĞİŞTİR
    // =====================================================

    function switchTab(tab) {

      const expenseView =
        document.getElementById(
          "expenseView"
        );

      const incomeView =
        document.getElementById(
          "incomeView"
        );

      const expenseButton =
        document.getElementById(
          "navExpenseBtn"
        );

      const incomeButton =
        document.getElementById(
          "navIncomeBtn"
        );


      expenseView.classList.add(
        "hidden"
      );

      incomeView.classList.add(
        "hidden"
      );


      expenseButton.classList.remove(
        "text-emerald-400"
      );

      expenseButton.classList.add(
        "text-slate-500"
      );


      incomeButton.classList.remove(
        "text-emerald-400"
      );

      incomeButton.classList.add(
        "text-slate-500"
      );


      if (tab === "expense") {

        expenseView.classList.remove(
          "hidden"
        );

        expenseButton.classList.remove(
          "text-slate-500"
        );

        expenseButton.classList.add(
          "text-emerald-400"
        );

        document.getElementById(
          "pageTitle"
        ).innerText =
          "Harcama Girişi";

      }


      if (tab === "income") {

        incomeView.classList.remove(
          "hidden"
        );

        incomeButton.classList.remove(
          "text-slate-500"
        );

        incomeButton.classList.add(
          "text-emerald-400"
        );

        document.getElementById(
          "pageTitle"
        ).innerText =
          "Gelir Girişi";

      }


      setStatus(
        "Hazır",
        "normal"
      );

    }



    // =====================================================
    // HARCAMA ANA KATEGORİLER
    // =====================================================

    function createMainCategories() {

      const grid =
        document.getElementById(
          "mainCategoriesGrid"
        );


      Object.entries(
        EXPENSE_CATEGORIES
      ).forEach(function ([name, info]) {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "main-category-button " +
          "flex items-center gap-2 " +
          "bg-slate-900 " +
          "border border-slate-800 " +
          "p-3 rounded-xl " +
          "text-left " +
          "hover:border-slate-700 " +
          "active:bg-slate-800";


        button.innerHTML = `

          <span class="text-xl">
            ${info.icon}
          </span>

          <span
            class="
              text-sm
              font-medium
              text-slate-200
            "
          >
            ${name}
          </span>

        `;


        button.onclick =
          function () {

            selectMainCategory(
              name,
              button
            );

          };


        grid.appendChild(
          button
        );

      });

    }



    // =====================================================
    // ANA KATEGORİ SEÇ
    // =====================================================

    function selectMainCategory(
      categoryName,
      selectedButton
    ) {

      selectedMainCategory =
        categoryName;


      document
        .querySelectorAll(
          ".main-category-button"
        )
        .forEach(function (button) {

          button.classList.remove(
            "border-emerald-500",
            "bg-slate-800"
          );

        });


      selectedButton.classList.add(
        "border-emerald-500",
        "bg-slate-800"
      );


      createSubCategories(
        categoryName
      );

    }



    // =====================================================
    // ALT KATEGORİ
    // =====================================================

    function createSubCategories(
      categoryName
    ) {

      const grid =
        document.getElementById(
          "subCategoriesGrid"
        );


      grid.innerHTML =
        "";


      EXPENSE_CATEGORIES[
        categoryName
      ].subs.forEach(
        function (subCategory) {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "bg-emerald-950/40 " +
            "border border-emerald-800/60 " +
            "text-emerald-200 " +
            "p-3 rounded-xl " +
            "text-xs font-semibold " +
            "hover:bg-emerald-900/50 " +
            "active:scale-95";


          button.innerText =
            subCategory;


          button.onclick =
            function () {

              submitExpense(
                subCategory
              );

            };


          grid.appendChild(
            button
          );

        }
      );


      document
        .getElementById(
          "subCategorySection"
        )
        .classList.remove(
          "hidden"
        );

    }



    // =====================================================
    // HARCAMA KATEGORİ TEMİZLE
    // =====================================================

    function resetCategorySelection() {

      selectedMainCategory =
        null;


      document
        .getElementById(
          "subCategorySection"
        )
        .classList.add(
          "hidden"
        );


      document
        .querySelectorAll(
          ".main-category-button"
        )
        .forEach(function (button) {

          button.classList.remove(
            "border-emerald-500",
            "bg-slate-800"
          );

        });

    }



    // =====================================================
    // GELİR BUTONLARI
    // =====================================================

    function createIncomeTypes() {

      const grid =
        document.getElementById(
          "incomeTypesGrid"
        );


      Object.entries(
        INCOME_TYPES
      ).forEach(
        function ([name, icon]) {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "flex items-center gap-2 " +
            "bg-slate-900 " +
            "border border-slate-800 " +
            "p-3 rounded-xl " +
            "text-left " +
            "hover:border-emerald-700 " +
            "active:bg-slate-800";


          button.innerHTML = `

            <span class="text-xl">
              ${icon}
            </span>

            <span
              class="
                text-sm
                font-medium
                text-slate-200
              "
            >
              ${name}
            </span>

          `;


          button.onclick =
            function () {

              submitIncome(
                name
              );

            };


          grid.appendChild(
            button
          );

        }
      );

    }



    // =====================================================
    // TARİH BİLGİLERİ
    // =====================================================

    function getDateInfo() {

      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          now.getDate()
        ).padStart(
          2,
          "0"
        );


      const hours =
        String(
          now.getHours()
        ).padStart(
          2,
          "0"
        );


      const minutes =
        String(
          now.getMinutes()
        ).padStart(
          2,
          "0"
        );


      return {

        date:
          `${year}-${month}-${day}`,

        time:
          `${hours}:${minutes}`,

        period:
          `${year}-${month}`

      };

    }



    // =====================================================
    // HARCAMA KAYDET
    // =====================================================

    async function submitExpense(
      subCategory
    ) {

      const amountInput =
        document.getElementById(
          "expenseAmount"
        );


      const amount =
        Number(
          amountInput.value
        );


      if (!amount || amount <= 0) {

        alert(
          "Lütfen geçerli bir harcama tutarı gir."
        );

        return;

      }


      const dateInfo =
        getDateInfo();


      const payload = {

        type:
          "expense",

        date:
          dateInfo.date,

        time:
          dateInfo.time,

        mainCategory:
          selectedMainCategory,

        subCategory:
          subCategory,

        amount:
          amount,

        description:
          document
            .getElementById(
              "expenseDescription"
            )
            .value
            .trim(),

        period:
          dateInfo.period

      };


      await sendData(
        payload,
        function () {

          amountInput.value =
            "";

          document
            .getElementById(
              "expenseDescription"
            )
            .value =
              "";

          resetCategorySelection();

        }
      );

    }



    // =====================================================
    // GELİR KAYDET
    // =====================================================

    async function submitIncome(
      incomeType
    ) {

      const amountInput =
        document.getElementById(
          "incomeAmount"
        );


      const amount =
        Number(
          amountInput.value
        );


      if (!amount || amount <= 0) {

        alert(
          "Lütfen geçerli bir gelir tutarı gir."
        );

        return;

      }


      const dateInfo =
        getDateInfo();


      const payload = {

        type:
          "income",

        date:
          dateInfo.date,

        time:
          dateInfo.time,

        incomeType:
          incomeType,

        amount:
          amount,

        description:
          document
            .getElementById(
              "incomeDescription"
            )
            .value
            .trim(),

        period:
          dateInfo.period

      };


      await sendData(
        payload,
        function () {

          amountInput.value =
            "";

          document
            .getElementById(
              "incomeDescription"
            )
            .value =
              "";

        }
      );

    }



    // =====================================================
    // VERİ GÖNDER
    // =====================================================

    async function sendData(
      payload,
      onSuccess
    ) {

      setStatus(
        "Kaydediliyor...",
        "loading"
      );


      try {

        await fetch(
          SCRIPT_URL,
          {

            method:
              "POST",

            mode:
              "no-cors",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


        if (onSuccess) {
          onSuccess();
        }


        setStatus(
          "Kaydedildi!",
          "success"
        );


        setTimeout(
          function () {

            setStatus(
              "Hazır",
              "normal"
            );

          },
          2500
        );


      } catch (error) {

        console.error(
          error
        );


        setStatus(
          "Hata!",
          "error"
        );

      }

    }



    // =====================================================
    // DURUM
    // =====================================================

    function setStatus(
      text,
      type
    ) {

      const badge =
        document.getElementById(
          "statusBadge"
        );


      badge.innerText =
        text;


      badge.className =
        "text-xs px-2.5 py-1 rounded-full";


      if (type === "success") {

        badge.classList.add(
          "bg-emerald-950",
          "text-emerald-300"
        );

      }

      else if (type === "loading") {

        badge.classList.add(
          "bg-amber-950",
          "text-amber-300"
        );

      }

      else if (type === "error") {

        badge.classList.add(
          "bg-red-950",
          "text-red-300"
        );

      }

      else {

        badge.classList.add(
          "bg-slate-800",
          "text-slate-400"
        );

      }

    }



    // =====================================================
    // ÖZET - SONRAKİ ADIM
    // =====================================================

    function showComingSoon() {

      alert(
        "Aylık Özet ekranını sonraki adımda ekleyeceğiz."
      );

    }



    // =====================================================
    // BAŞLAT
    // =====================================================

    createMainCategories();

    createIncomeTypes();


  </script>


</body>

</html>
