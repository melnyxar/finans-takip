<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Finans Takip</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    body {
      -webkit-tap-highlight-color: transparent;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

  </style>

</head>


<body
  class="
    bg-slate-950
    text-slate-100
    min-h-screen
    pb-24
  "
>


  <div
    class="
      w-full
      max-w-md
      mx-auto
      p-4
    "
  >


    <!-- ===============================================
         BAŞLIK
    ================================================ -->

    <header
      class="
        flex
        justify-between
        items-center
        py-2
        border-b
        border-slate-800
      "
    >

      <div>

        <p
          class="
            text-xs
            text-emerald-400
            font-medium
          "
        >
          Finans Takip
        </p>


        <h1
          id="pageTitle"
          class="
            text-lg
            font-semibold
            text-slate-200
          "
        >
          Harcama Girişi
        </h1>

      </div>


      <span
        id="statusBadge"
        class="
          text-xs
          px-2.5
          py-1
          rounded-full
          bg-slate-800
          text-slate-400
        "
      >
        Hazır
      </span>

    </header>



    <!-- ===============================================
         HARCAMA
    ================================================ -->

    <main
      id="expenseView"
      class="
        mt-4
        space-y-4
      "
    >


      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-5
          text-center
        "
      >

        <p
          class="
            text-xs
            text-slate-400
            uppercase
            tracking-wider
            mb-2
          "
        >
          Harcama Tutarı
        </p>


        <div
          class="
            flex
            justify-center
            items-center
            gap-2
          "
        >

          <span
            class="
              text-3xl
              font-bold
              text-rose-400
            "
          >
            ₺
          </span>


          <input
            id="expenseAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"

            class="
              bg-transparent
              text-4xl
              font-bold
              text-center
              text-white
              w-48
              focus:outline-none
              placeholder-slate-600
            "
          >

        </div>

      </div>


      <input
        id="expenseDescription"
        type="text"
        maxlength="150"

        placeholder="
          Kısa açıklama (opsiyonel)...
        "

        class="
          w-full
          bg-slate-900
          border
          border-slate-800
          rounded-xl
          px-4
          py-3
          text-sm
          focus:outline-none
          focus:border-emerald-500
          placeholder-slate-500
        "
      >


      <div>

        <p
          class="
            text-xs
            text-slate-400
            mb-2
          "
        >
          1. Kategori Seç
        </p>


        <div
          id="expenseCategories"
          class="
            grid
            grid-cols-2
            gap-2.5
          "
        ></div>

      </div>


      <div
        id="subCategorySection"
        class="hidden"
      >

        <div
          class="
            flex
            justify-between
            mb-2
          "
        >

          <p
            class="
              text-xs
              text-slate-400
            "
          >
            2. Alt Kategori Seç
          </p>


          <button
            onclick="
              resetExpenseCategory()
            "

            class="
              text-xs
              text-slate-500
            "
          >
            Vazgeç
          </button>

        </div>


        <div
          id="expenseSubCategories"
          class="
            grid
            grid-cols-2
            gap-2
          "
        ></div>

      </div>


    </main>



    <!-- ===============================================
         GELİR
    ================================================ -->

    <main
      id="incomeView"
      class="
        hidden
        mt-4
        space-y-4
      "
    >


      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-5
          text-center
        "
      >

        <p
          class="
            text-xs
            text-slate-400
            uppercase
            tracking-wider
            mb-2
          "
        >
          Gelir Tutarı
        </p>


        <div
          class="
            flex
            justify-center
            items-center
            gap-2
          "
        >

          <span
            class="
              text-3xl
              font-bold
              text-emerald-400
            "
          >
            ₺
          </span>


          <input
            id="incomeAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"

            class="
              bg-transparent
              text-4xl
              font-bold
              text-center
              text-white
              w-48
              focus:outline-none
              placeholder-slate-600
            "
          >

        </div>

      </div>


      <input
        id="incomeDescription"
        type="text"
        maxlength="150"
        placeholder="
          Kısa açıklama (opsiyonel)...
        "

        class="
          w-full
          bg-slate-900
          border
          border-slate-800
          rounded-xl
          px-4
          py-3
          text-sm
          focus:outline-none
          focus:border-emerald-500
          placeholder-slate-500
        "
      >


      <div>

        <p
          class="
            text-xs
            text-slate-400
            mb-2
          "
        >
          Gelir Türü Seç
        </p>


        <div
          id="incomeTypes"
          class="
            grid
            grid-cols-2
            gap-2.5
          "
        ></div>

      </div>


    </main>



    <!-- ===============================================
         ÖZET
    ================================================ -->

    <main
      id="summaryView"
      class="
        hidden
        mt-4
        space-y-4
      "
    >


      <!-- AY -->

      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-4
        "
      >

        <div
          class="
            flex
            justify-between
            items-center
          "
        >

          <button
            onclick="
              changeMonth(-1)
            "

            class="
              bg-slate-800
              rounded-lg
              px-3
              py-2
            "
          >
            ◀
          </button>


          <div
            class="
              text-center
            "
          >

            <p
              class="
                text-xs
                text-slate-500
              "
            >
              DÖNEM
            </p>

            <p
              id="summaryPeriod"
              class="
                font-semibold
                mt-1
              "
            >
              ---
            </p>

          </div>


          <button
            onclick="
              changeMonth(1)
            "

            class="
              bg-slate-800
              rounded-lg
              px-3
              py-2
            "
          >
            ▶
          </button>

        </div>

      </div>



      <!-- GELİR / HARCAMA -->

      <div
        class="
          grid
          grid-cols-2
          gap-3
        "
      >


        <div
          class="
            bg-slate-900
            border
            border-slate-800
            rounded-2xl
            p-4
          "
        >

          <p
            class="
              text-xs
              text-slate-500
            "
          >
            TOPLAM GELİR
          </p>


          <p
            id="totalIncome"
            class="
              text-xl
              font-bold
              text-emerald-400
              mt-2
            "
          >
            ₺ 0,00
          </p>

        </div>



        <div
          class="
            bg-slate-900
            border
            border-slate-800
            rounded-2xl
            p-4
          "
        >

          <p
            class="
              text-xs
              text-slate-500
            "
          >
            TOPLAM HARCAMA
          </p>


          <p
            id="totalSpend"
            class="
              text-xl
              font-bold
              text-rose-400
              mt-2
            "
          >
            ₺ 0,00
          </p>

        </div>


      </div>



      <!-- NET -->

      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-5
          text-center
        "
      >

        <p
          class="
            text-xs
            text-slate-500
            uppercase
            tracking-wider
          "
        >
          Bu Ay Net
        </p>


        <p
          id="netAmount"
          class="
            text-3xl
            font-bold
            mt-2
          "
        >
          ₺ 0,00
        </p>

      </div>



      <!-- HARCAMA DAĞILIMI -->

      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-4
        "
      >

        <h3
          class="
            text-xs
            text-slate-400
            font-semibold
            uppercase
            mb-4
          "
        >
          Harcama Dağılımı
        </h3>


        <div
          id="expenseSummaryList"
          class="space-y-4"
        >

          <p
            class="
              text-xs
              text-slate-500
              text-center
            "
          >
            Veriler yükleniyor...
          </p>

        </div>

      </div>



      <!-- GELİR DAĞILIMI -->

      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-4
        "
      >

        <h3
          class="
            text-xs
            text-slate-400
            font-semibold
            uppercase
            mb-4
          "
        >
          Gelir Dağılımı
        </h3>


        <div
          id="incomeSummaryList"
          class="space-y-4"
        >

          <p
            class="
              text-xs
              text-slate-500
              text-center
            "
          >
            Henüz gelir yok.
          </p>

        </div>

      </div>


    </main>


  </div>



  <!-- ===============================================
       ALT MENÜ
  ================================================ -->

  <nav
    class="
      fixed
      bottom-0
      left-0
      right-0
      bg-slate-900/95
      border-t
      border-slate-800
      flex
      justify-around
      py-3
      z-50
    "
  >


    <button
      id="navExpense"
      onclick="
        switchTab('expense')
      "

      class="
        flex
        flex-col
        items-center
        gap-1
        text-emerald-400
      "
    >
      <span>➕</span>
      <span class="text-xs">
        Harcama
      </span>
    </button>


    <button
      id="navIncome"
      onclick="
        switchTab('income')
      "

      class="
        flex
        flex-col
        items-center
        gap-1
        text-slate-500
      "
    >
      <span>💰</span>
      <span class="text-xs">
        Gelir
      </span>
    </button>


    <button
      id="navSummary"
      onclick="
        switchTab('summary')
      "

      class="
        flex
        flex-col
        items-center
        gap-1
        text-slate-500
      "
    >
      <span>📊</span>
      <span class="text-xs">
        Özet
      </span>
    </button>


  </nav>



  <script>


    // ===============================================
    // APPS SCRIPT
    // ===============================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbz14ItYilxfdHDyNowumHNGUeYYRddF53B-3YJ863icIcwbZDaK1h8BwrDPl8VNNdq3/exec";



    // ===============================================
    // HARCAMA KATEGORİLERİ
    // ===============================================

    const EXPENSE_CATEGORIES = {

      "Market": {
        icon: "🛒",
        subs: [
          "Ev İhtiyaçları",
          "Atıştırmalık"
        ]
      },

      "Yemek": {
        icon: "🍔",
        subs: [
          "Dışarıda Restoran/Kafe",
          "Yemek Siparişi"
        ]
      },

      "Ulaşım": {
        icon: "🚌",
        subs: [
          "Toplu Taşıma / Akbil",
          "Taksi",
          "Şehirlerarası Seyahat"
        ]
      },

      "Eğlence & Sosyal": {
        icon: "🎟️",
        subs: [
          "Sinema/Tiyatro",
          "Dışarıda Kahve",
          "Oyunlar",
          "Sosyal Aktivite"
        ]
      },

      "Üniversite": {
        icon: "🎓",
        subs: [
          "Yemekhane",
          "Kırtasiye / Baskı",
          "Kampüs Kahve/Market",
          "Harç / Kayıt",
          "Kulüp / Etkinlik"
        ]
      },

      "Sabit Abonelikler": {
        icon: "💳",
        subs: [
          "Akbil Abonman",
          "Spotify",
          "Dijital Abonelik"
        ]
      },

      "Kişisel Bakım & Sağlık": {
        icon: "✂️",
        subs: [
          "Kıyafet / Ayakkabı",
          "Kuaför / Berber",
          "Eczane / Sağlık"
        ]
      }

    };



    const INCOME_TYPES = {

      "Aile Desteği": "👨‍👩‍👦",

      "Burs": "🎓",

      "İş / Freelance": "💻",

      "İade / Geri Ödeme": "💸",

      "Hediye": "🎁",

      "Diğer": "💰"

    };



    let selectedExpenseCategory =
      null;


    let summaryDate =
      new Date();



    // ===============================================
    // SEKME
    // ===============================================

    function switchTab(tab) {

      const views = {
        expense:
          document.getElementById(
            "expenseView"
          ),

        income:
          document.getElementById(
            "incomeView"
          ),

        summary:
          document.getElementById(
            "summaryView"
          )
      };


      Object.values(
        views
      ).forEach(function(view) {

        view.classList.add(
          "hidden"
        );

      });


      views[
        tab
      ].classList.remove(
        "hidden"
      );


      const navs = {

        expense:
          document.getElementById(
            "navExpense"
          ),

        income:
          document.getElementById(
            "navIncome"
          ),

        summary:
          document.getElementById(
            "navSummary"
          )

      };


      Object.values(
        navs
      ).forEach(function(nav) {

        nav.classList.remove(
          "text-emerald-400"
        );

        nav.classList.add(
          "text-slate-500"
        );

      });


      navs[
        tab
      ].classList.remove(
        "text-slate-500"
      );


      navs[
        tab
      ].classList.add(
        "text-emerald-400"
      );


      const titles = {

        expense:
          "Harcama Girişi",

        income:
          "Gelir Girişi",

        summary:
          "Aylık Özet"

      };


      document.getElementById(
        "pageTitle"
      ).innerText =
        titles[tab];


      setStatus(
        "Hazır",
        "normal"
      );


      if (
        tab === "summary"
      ) {

        loadSummary();
      }

    }



    // ===============================================
    // HARCAMA KATEGORİLERİ
    // ===============================================

    function createExpenseCategories() {

      const grid =
        document.getElementById(
          "expenseCategories"
        );


      Object.entries(
        EXPENSE_CATEGORIES
      ).forEach(
        function([name, info]) {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "expense-category flex items-center gap-2 bg-slate-900 border border-slate-800 p-3 rounded-xl text-left";


          button.innerHTML = `

            <span class="text-xl">
              ${info.icon}
            </span>

            <span class="text-sm font-medium">
              ${name}
            </span>

          `;


          button.onclick =
            function() {

              selectExpenseCategory(
                name,
                button
              );

            };


          grid.appendChild(
            button
          );

        }
      );

    }



    function selectExpenseCategory(
      name,
      selectedButton
    ) {

      selectedExpenseCategory =
        name;


      document
        .querySelectorAll(
          ".expense-category"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "border-emerald-500"
            );

          }
        );


      selectedButton
        .classList.add(
          "border-emerald-500"
        );


      const subGrid =
        document.getElementById(
          "expenseSubCategories"
        );


      subGrid.innerHTML =
        "";


      EXPENSE_CATEGORIES[
        name
      ].subs.forEach(
        function(sub) {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "bg-emerald-950/40 border border-emerald-800/60 text-emerald-200 p-3 rounded-xl text-xs font-semibold";


          button.innerText =
            sub;


          button.onclick =
            function() {

              submitExpense(
                sub
              );

            };


          subGrid.appendChild(
            button
          );

        }
      );


      document
        .getElementById(
          "subCategorySection"
        )
        .classList.remove(
          "hidden"
        );

    }



    function resetExpenseCategory() {

      selectedExpenseCategory =
        null;


      document
        .getElementById(
          "subCategorySection"
        )
        .classList.add(
          "hidden"
        );


      document
        .querySelectorAll(
          ".expense-category"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "border-emerald-500"
            );

          }
        );

    }



    // ===============================================
    // GELİR TÜRLERİ
    // ===============================================

    function createIncomeTypes() {

      const grid =
        document.getElementById(
          "incomeTypes"
        );


      Object.entries(
        INCOME_TYPES
      ).forEach(
        function([name, icon]) {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "flex items-center gap-2 bg-slate-900 border border-slate-800 p-3 rounded-xl text-left";


          button.innerHTML = `

            <span class="text-xl">
              ${icon}
            </span>

            <span class="text-sm font-medium">
              ${name}
            </span>

          `;


          button.onclick =
            function() {

              submitIncome(
                name
              );

            };


          grid.appendChild(
            button
          );

        }
      );

    }



    // ===============================================
    // TARİH
    // ===============================================

    function getDateInfo() {

      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          now.getDate()
        ).padStart(
          2,
          "0"
        );


      const hour =
        String(
          now.getHours()
        ).padStart(
          2,
          "0"
        );


      const minute =
        String(
          now.getMinutes()
        ).padStart(
          2,
          "0"
        );


      return {

        date:
          `${year}-${month}-${day}`,

        time:
          `${hour}:${minute}`,

        period:
          `${year}-${month}`

      };

    }



    // ===============================================
    // HARCAMA KAYDET
    // ===============================================

    async function submitExpense(
      subCategory
    ) {

      const input =
        document.getElementById(
          "expenseAmount"
        );


      const amount =
        Number(
          input.value
        );


      if (
        !amount ||
        amount <= 0
      ) {

        alert(
          "Geçerli bir harcama tutarı gir."
        );

        return;
      }


      const date =
        getDateInfo();


      await sendData(
        {

          type:
            "expense",

          date:
            date.date,

          time:
            date.time,

          mainCategory:
            selectedExpenseCategory,

          subCategory:
            subCategory,

          amount:
            amount,

          description:
            document
              .getElementById(
                "expenseDescription"
              )
              .value
              .trim(),

          period:
            date.period

        }
      );


      input.value =
        "";


      document
        .getElementById(
          "expenseDescription"
        )
        .value =
          "";


      resetExpenseCategory();

    }



    // ===============================================
    // GELİR KAYDET
    // ===============================================

    async function submitIncome(
      incomeType
    ) {

      const input =
        document.getElementById(
          "incomeAmount"
        );


      const amount =
        Number(
          input.value
        );


      if (
        !amount ||
        amount <= 0
      ) {

        alert(
          "Geçerli bir gelir tutarı gir."
        );

        return;
      }


      const date =
        getDateInfo();


      await sendData(
        {

          type:
            "income",

          date:
            date.date,

          time:
            date.time,

          incomeType:
            incomeType,

          amount:
            amount,

          description:
            document
              .getElementById(
                "incomeDescription"
              )
              .value
              .trim(),

          period:
            date.period

        }
      );


      input.value =
        "";


      document
        .getElementById(
          "incomeDescription"
        )
        .value =
          "";

    }



    // ===============================================
    // POST
    // ===============================================

    async function sendData(
      payload
    ) {

      setStatus(
        "Kaydediliyor...",
        "loading"
      );


      try {

        await fetch(
          SCRIPT_URL,
          {

            method:
              "POST",

            mode:
              "no-cors",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


        setStatus(
          "Kaydedildi!",
          "success"
        );


        setTimeout(
          function() {

            setStatus(
              "Hazır",
              "normal"
            );

          },
          2000
        );


      } catch(error) {

        console.error(
          error
        );


        setStatus(
          "Hata!",
          "error"
        );


        throw error;
      }

    }



    // ===============================================
    // AY DEĞİŞTİR
    // ===============================================

    function changeMonth(
      offset
    ) {

      summaryDate.setMonth(
        summaryDate.getMonth() +
        offset
      );


      loadSummary();

    }



    // ===============================================
    // ÖZET YÜKLE
    // ===============================================

    function loadSummary() {

      const year =
        summaryDate.getFullYear();


      const month =
        String(
          summaryDate.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const period =
        `${year}-${month}`;


      document
        .getElementById(
          "summaryPeriod"
        )
        .innerText =
          period;


      setStatus(
        "Yükleniyor...",
        "loading"
      );


      const old =
        document.getElementById(
          "summaryJsonp"
        );


      if (old) {
        old.remove();
      }


      window.handleSummaryData =
        function(data) {

          if (
            data.status === "error"
          ) {

            showSummaryError(
              data.message ||
              "Veri alınamadı."
            );

            return;
          }


          renderSummary(
            data
          );


          setStatus(
            "Hazır",
            "normal"
          );

        };


      const script =
        document.createElement(
          "script"
        );


      script.id =
        "summaryJsonp";


      script.src =
        SCRIPT_URL +
        "?period=" +
        encodeURIComponent(
          period
        ) +
        "&callback=handleSummaryData" +
        "&_=" +
        Date.now();


      script.onerror =
        function() {

          showSummaryError(
            "Özet verileri yüklenemedi."
          );

        };


      document.body.appendChild(
        script
      );

    }



    // ===============================================
    // ÖZET ÇİZ
    // ===============================================

    function renderSummary(
      data
    ) {

      const totalIncome =
        Number(
          data.totalIncome || 0
        );


      const totalSpend =
        Number(
          data.totalSpend || 0
        );


      const net =
        Number(
          data.netAmount || 0
        );


      document
        .getElementById(
          "totalIncome"
        )
        .innerText =
          formatMoney(
            totalIncome
          );


      document
        .getElementById(
          "totalSpend"
        )
        .innerText =
          formatMoney(
            totalSpend
          );


      const netElement =
        document.getElementById(
          "netAmount"
        );


      netElement.innerText =
        (net > 0 ? "+ " : "") +
        formatMoney(net);


      netElement.classList.remove(
        "text-emerald-400",
        "text-rose-400",
        "text-slate-300"
      );


      if (net > 0) {

        netElement.classList.add(
          "text-emerald-400"
        );

      }

      else if (net < 0) {

        netElement.classList.add(
          "text-rose-400"
        );

      }

      else {

        netElement.classList.add(
          "text-slate-300"
        );

      }


      renderDistribution(
        "expenseSummaryList",
        data.categories || {},
        totalSpend,
        EXPENSE_CATEGORIES,
        "Bu ay harcama bulunmuyor.",
        false
      );


      renderDistribution(
        "incomeSummaryList",
        data.incomeCategories || {},
        totalIncome,
        INCOME_TYPES,
        "Bu ay gelir bulunmuyor.",
        true
      );

    }



    // ===============================================
    // DAĞILIM ÇİZ
    // ===============================================

    function renderDistribution(
      targetId,
      items,
      total,
      iconSource,
      emptyText,
      incomeMode
    ) {

      const target =
        document.getElementById(
          targetId
        );


      target.innerHTML =
        "";


      const entries =
        Object.entries(
          items
        ).sort(
          function(a, b) {

            return b[1] - a[1];

          }
        );


      if (
        entries.length === 0 ||
        total <= 0
      ) {

        target.innerHTML = `

          <p
            class="
              text-xs
              text-slate-500
              text-center
              py-3
            "
          >
            ${emptyText}
          </p>

        `;

        return;
      }


      entries.forEach(
        function([name, amount]) {

          const percentage =
            (
              amount /
              total *
              100
            ).toFixed(1);


          let icon =
            "📌";


          if (incomeMode) {

            icon =
              iconSource[name] ||
              "💰";

          }

          else if (
            iconSource[name]
          ) {

            icon =
              iconSource[name].icon;

          }


          const row =
            document.createElement(
              "div"
            );


          row.innerHTML = `

            <div
              class="
                flex
                justify-between
                items-center
                text-xs
                mb-1.5
              "
            >

              <span
                class="
                  text-slate-300
                  font-medium
                "
              >
                ${icon}
                ${name}
              </span>


              <span
                class="
                  text-slate-200
                  font-semibold
                "
              >
                ${formatMoney(amount)}

                <span
                  class="
                    text-slate-500
                    font-normal
                  "
                >
                  %${percentage}
                </span>

              </span>

            </div>


            <div
              class="
                h-2
                bg-slate-800
                rounded-full
                overflow-hidden
              "
            >

              <div
                class="
                  h-2
                  ${
                    incomeMode
                      ? "bg-emerald-500"
                      : "bg-rose-500"
                  }
                  rounded-full
                "

                style="
                  width:
                  ${percentage}%
                "
              ></div>

            </div>

          `;


          target.appendChild(
            row
          );

        }
      );

    }



    // ===============================================
    // PARA FORMAT
    // ===============================================

    function formatMoney(
      amount
    ) {

      return (
        "₺ " +
        Number(
          amount || 0
        ).toLocaleString(
          "tr-TR",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )
      );

    }



    // ===============================================
    // ÖZET HATA
    // ===============================================

    function showSummaryError(
      message
    ) {

      setStatus(
        "Hata!",
        "error"
      );


      document
        .getElementById(
          "expenseSummaryList"
        )
        .innerHTML = `

          <p
            class="
              text-xs
              text-rose-400
              text-center
            "
          >
            ${message}
          </p>

        `;

    }



    // ===============================================
    // STATUS
    // ===============================================

    function setStatus(
      text,
      type
    ) {

      const badge =
        document.getElementById(
          "statusBadge"
        );


      badge.innerText =
        text;


      badge.className =
        "text-xs px-2.5 py-1 rounded-full";


      if (
        type === "success"
      ) {

        badge.classList.add(
          "bg-emerald-950",
          "text-emerald-300"
        );

      }

      else if (
        type === "loading"
      ) {

        badge.classList.add(
          "bg-amber-950",
          "text-amber-300"
        );

      }

      else if (
        type === "error"
      ) {

        badge.classList.add(
          "bg-rose-950",
          "text-rose-300"
        );

      }

      else {

        badge.classList.add(
          "bg-slate-800",
          "text-slate-400"
        );

      }

    }



    // ===============================================
    // BAŞLAT
    // ===============================================

    createExpenseCategories();

    createIncomeTypes();


  </script>


</body>

</html>
