<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Finans Takip</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    body {
      -webkit-tap-highlight-color: transparent;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

  </style>

</head>


<body
  class="
    bg-slate-950
    text-slate-100
    min-h-screen
    flex
    flex-col
  "
>


  <!-- UYGULAMA -->

  <div
    id="app"
    class="
      w-full
      max-w-md
      mx-auto
      p-4
      pb-24
    "
  >


    <!-- BAŞLIK -->

    <header
      class="
        flex
        justify-between
        items-center
        py-2
        border-b
        border-slate-800
      "
    >

      <div>

        <p
          class="
            text-xs
            text-emerald-400
            font-medium
          "
        >
          Finans Takip
        </p>

        <h1
          id="pageTitle"
          class="
            text-lg
            font-semibold
            text-slate-200
          "
        >
          Harcama Girişi
        </h1>

      </div>


      <span
        id="statusBadge"
        class="
          text-xs
          px-2.5
          py-1
          rounded-full
          bg-slate-800
          text-slate-400
        "
      >
        Hazır
      </span>

    </header>


    <!--
      EKRANLARI BURAYA EKLEYECEĞİZ
    -->

    <main
      class="
        mt-4
      "
    >

      <div
        class="
          bg-slate-900
          border
          border-slate-800
          rounded-2xl
          p-6
          text-center
        "
      >

        <p
          class="
            text-emerald-400
            font-semibold
          "
        >
          Finans Takip hazır.
        </p>

        <p
          class="
            text-sm
            text-slate-500
            mt-2
          "
        >
          Harcama ve gelir ekranlarını şimdi oluşturacağız.
        </p>

      </div>

    </main>


  </div>


  <!-- ALT MENÜ -->

  <nav
    class="
      fixed
      bottom-0
      left-0
      right-0
      bg-slate-900
      border-t
      border-slate-800
      flex
      justify-around
      py-3
    "
  >


    <button
      class="
        flex
        flex-col
        items-center
        gap-1
        text-emerald-400
      "
    >

      <span class="text-lg">
        ➕
      </span>

      <span class="text-xs">
        Harcama
      </span>

    </button>


    <button
      class="
        flex
        flex-col
        items-center
        gap-1
        text-slate-500
      "
    >

      <span class="text-lg">
        💰
      </span>

      <span class="text-xs">
        Gelir
      </span>

    </button>


    <button
      class="
        flex
        flex-col
        items-center
        gap-1
        text-slate-500
      "
    >

      <span class="text-lg">
        📊
      </span>

      <span class="text-xs">
        Özet
      </span>

    </button>


  </nav>


</body>

</html>
